name: Compile sketches
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Kiem tra wokwi/ da cap nhat
        run: python3 tools/wokwi_pack.py --check
      - uses: arduino/compile-sketches@v1
        with:
          fqbn: esp32:esp32:esp32s3:PSRAM=opi,FlashSize=16M,CDCOnBoot=cdc
          platforms: |
            - name: esp32:esp32
              source-url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
              version: 3.3.4
          libraries: |
            - name: VL53L0X
            - source-path: libraries/RobotConfig
            - source-path: libraries/RobotCore
          sketch-paths: |
            - phase1_movement
            - wokwi
          enable-warnings-report: true
